[package]
name = "bitcoin-payment-instructions"
version = "0.5.0"
authors = ["Matt Corallo", "Ben Carman"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-bitcoin/bitcoin-payment-instructions"
description = """
A parser for arbitrary bitcoin payment instructions.
"""
edition = "2021"

[package.metadata.docs.rs]
features = ["std", "http"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
http = ["reqwest", "std", "serde", "serde_json"]
std = ["dnssec-prover", "getrandom"]
default = ["std"]

[dependencies]
#lightning-invoice = { version = "0.34.0-beta1", default-features = false }
#lightning-invoice = { git = "https://github.com/lightningdevkit/rust-lightning", branch="main", default-features = false }
#lightning-invoice = { path = "../rust-lightning/lightning-invoice", default-features = false }
lightning-invoice = { git = "https://github.com/lightningdevkit/rust-lightning", rev = "bb5504ec62d4b7e9d5626d8b1a6de60d71e8d370", default-features = false }
#lightning = { version = "0.2.0-rc1", default-features = false, features = ["dnssec"] }
#lightning = { git = "https://github.com/lightningdevkit/rust-lightning", branch="main", default-features = false, features = ["dnssec"] }
#lightning = { path = "../rust-lightning/lightning", default-features = false, features = ["dnssec"]}
lightning = { git = "https://github.com/lightningdevkit/rust-lightning", rev = "bb5504ec62d4b7e9d5626d8b1a6de60d71e8d370", default-features = false, features = ["dnssec"] }
bitcoin = { version = "0.32", default-features = false }
getrandom = { version = "0.3", default-features = false, optional = true }
dnssec-prover = { version = "0.6", default-features = false, optional = true, features = ["validation", "std", "tokio"] }
reqwest = { version = "0.11", default-features = false, optional = true, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1.0", default-features = false, optional = true, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, optional = true, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1.0", default-features = false, features = ["rt", "macros"] }
#lightning = { version = "0.2.0-rc1", features = ["std"] }
#lightning = { git = "https://github.com/lightningdevkit/rust-lightning", branch="main", features = ["std"] }
#lightning = { path = "../rust-lightning/lightning", features = ["std"] }
lightning = { git = "https://github.com/lightningdevkit/rust-lightning", rev = "bb5504ec62d4b7e9d5626d8b1a6de60d71e8d370", features = ["std"] }
#lightning-net-tokio = { version = "0.2.0-rc1", default-features = false }
#lightning-net-tokio = { git = "https://github.com/lightningdevkit/rust-lightning", branch="main", default-features = false }
#lightning-net-tokio = { path = "../rust-lightning/lightning-net-tokio" }
lightning-net-tokio = { git = "https://github.com/lightningdevkit/rust-lightning", rev = "bb5504ec62d4b7e9d5626d8b1a6de60d71e8d370", default-features = false }

